name: Public real-model smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/model-smoke.yml"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "requirements-cpu.lock"
      - "requirements-dev.lock"
      - "src/traffic_risk/app.py"
      - "src/traffic_risk/cnn_contract.py"
      - "src/traffic_risk/config.py"
      - "src/traffic_risk/contracts.py"
      - "src/traffic_risk/download_models.py"
      - "src/traffic_risk/inference_outcome.py"
      - "src/traffic_risk/model_runtime.py"
      - "src/traffic_risk/pipeline.py"
      - "src/traffic_risk/predict_tl_color.py"
      - "src/traffic_risk/smoke_rules.py"
      - "src/traffic_risk/model_manifest.json"
      - "tests/test_public_rules_detection.py"
      - "tests/test_real_model_smoke.py"
      - "tools/real_model_smoke.py"

permissions:
  contents: read

concurrency:
  group: model-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-smoke:
    name: ${{ matrix.os }} / Python 3.11 public model
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked CPU and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install --no-deps -r requirements-dev.lock && python -m pip install --no-deps -e .
      - name: Download and verify the public YOLO asset
        run: python -m tools.download_models
      - name: "Real public model smoke: gray image, readiness, and API"
        env:
          RISK_DEVICE: cpu
        run: traffic-risk smoke-rules
      - name: "Synthetic controlled detector regressions: light and person, light only, empty"
        run: python -m pytest tests/test_public_rules_detection.py -q -o addopts=--strict-markers
