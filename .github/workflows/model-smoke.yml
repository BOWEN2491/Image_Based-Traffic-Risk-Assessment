name: Real-model smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-smoke:
    name: Download and load release models on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: python -m pip install --upgrade pip && python -m pip install --no-deps -r requirements-cpu.lock && python -m pip install --no-deps -e .
      - name: Download and verify release assets
        run: python -m tools.download_models
      - name: Exercise YOLO, CNN, XGBoost and the response contract
        env:
          RISK_DEVICE: cpu
        run: python -m tools.real_model_smoke
