name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install --no-deps -r requirements-dev.lock && python -m pip install --no-deps -e .
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Lint
        run: ruff check src tests tools
      - name: Test with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Runtime and API coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: >-
          python -c "import cv2, pytest, sys; sys.exit(pytest.main([
          'tests/test_app.py', 'tests/test_model_tools.py', 'tests/test_predict_pipeline.py',
          'tests/test_traffic_risk_package.py', '-o', 'addopts=--strict-markers',
          '--cov=traffic_risk.app', '--cov=traffic_risk.model_runtime', '--cov=traffic_risk.pipeline',
          '--cov-report=term-missing', '--cov-report=xml:coverage-runtime.xml', '--cov-fail-under=85']))"
      - name: Build and smoke-test wheel outside the source tree
        run: |
          python -m build --wheel
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'tools.wheel_smoke', glob.glob('dist/*.whl')[0], '--lock', 'requirements-cpu.lock'])"
      - name: Import training CLI dependencies
        run: python -c "import joblib, sklearn; import traffic_risk.build_XGBoost, traffic_risk.train_tl_cnn"
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage
          path: coverage.xml
      - name: Upload runtime coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-runtime-api-coverage
          path: coverage-runtime.xml

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk_frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: risk_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
