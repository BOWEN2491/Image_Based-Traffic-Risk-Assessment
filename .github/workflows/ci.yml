name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install --no-deps -r requirements-dev.lock && python -m pip install --no-deps -e .
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Lint
        run: ruff check src tests tools
      - name: Test with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Build and smoke-test wheel outside the source tree
        run: |
          python -m build --wheel
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'tools.wheel_smoke', glob.glob('dist/*.whl')[0], '--lock', 'requirements-cpu.lock'])"
      - name: Import training CLI dependencies
        run: python -c "import joblib, sklearn; import src.build_XGBoost, src.train_tl_cnn"
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk_frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: risk_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
